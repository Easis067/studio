<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | ABOUT</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --white: #F9F9F9;
            --black: #111111;
            --accent-blue: #00E1D9; 
        }

        body {
            background-color: var(--white);
            color: var(--black);
            margin: 0;
            font-family: "Space Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 语言切换逻辑 */
        .lang-zh { display: none !important; }
        .lang-en { display: block !important; }
        body.mode-zh .lang-zh { display: block !important; }
        body.mode-zh .lang-en { display: none !important; }
        body.mode-en .lang-en { display: block !important; }
        body.mode-en .lang-zh { display: none !important; }

        /* 导航栏 */
        .global-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 100px; position: fixed; width: 100%; top: 0;
            z-index: 1001; box-sizing: border-box;
            border-bottom: 1.5px solid var(--black);
            background-color: var(--white); 
        }
        .nav-logo a { font-size: 2rem; font-weight: 900; text-decoration: none; color: var(--black); letter-spacing: -0.03em; }
        .nav-links { display: flex; list-style: none; gap: 30px; margin: 0; padding: 0; }
        .nav-links > li > a { 
            text-decoration: none; color: var(--black); font-size: 1.05rem; font-weight: 700; 
            text-transform: uppercase; padding: 6px 16px; border: 1.5px solid var(--black);
            display: inline-block; transition: 0.2s ease-in-out;
        }
        .nav-links > li > a:hover { background: var(--accent-blue) !important; color: var(--black) !important; box-shadow: 4px 4px 0 var(--black); }

        .lang-switch { margin-left: 50px; border: 1.5px solid var(--black); padding: 2px; background: transparent; display: flex; }
        .lang-switch span { padding: 4px 12px; cursor: pointer; font-weight: 700; color: inherit; font-size: 0.9rem; }
        .lang-switch .active { background: var(--accent-blue); color: var(--black) !important; }

        /* 内容区布局 */
        .about-container {
            display: grid; grid-template-columns: 1fr 1fr;
            padding: 240px 100px 100px 100px; gap: 120px; max-width: 1400px;
            margin: 0 auto; box-sizing: border-box;
        }

        .about-title { font-size: 9rem; font-weight: 900; margin: 0; line-height: 0.85; text-transform: uppercase; }
        .label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--black); margin-bottom: 25px; font-weight: 900; opacity: 0.4; }
        .intro-text { font-size: 1.45rem; line-height: 1.7; font-weight: 500; margin: 0; color: var(--black); }

        /* 便签墙 / 交互装置 */
        .pinboard { 
            display: flex; flex-direction: column; gap: 20px; margin-top: 40px;
        }
        .note-card, .note-input {
            background: #fff; padding: 20px;
            border: 1.5px solid var(--black);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            transform: rotate(-1deg);
            transition: 0.3s;
        }
        .note-input { background: var(--accent-blue); }
        .note-input input, .note-input textarea { 
            width: 100%; border: none; background: transparent; 
            border-bottom: 1.5px solid var(--black); 
            padding: 5px 0; font-family: inherit; font-weight: 700;
        }
        .note-input button { 
            cursor: pointer; background: var(--black); color: var(--white); 
            border: none; padding: 10px; font-weight: 900; margin-top: 15px; width: 100%;
        }

        @media (max-width: 1024px) {
            .about-container { grid-template-columns: 1fr; padding: 180px 40px 60px; }
            .about-title { font-size: 5.5rem; }
        }
    </style>
</head>
<body class="mode-en">

    <nav class="global-nav">
        <div class="nav-logo"><a href="/index.html">EASIS</a></div>
        <ul class="nav-links">
            <li><a href="#">Work</a></li>
            <li><a href="#">Logs</a></li>
            <li><a href="/about.html">About Me</a></li>
        </ul>
        <div class="lang-switch">
            <span id="btn-en" class="active" onclick="switchLang('en')">EN</span>
            <span id="btn-zh" onclick="switchLang('zh')">中文</span>
        </div>
    </nav>

    <main class="about-container">
        <div class="about-title-wrapper">
            <h1 class="about-title">About</h1>
        </div>

        <div class="content-section">
            <section class="about-section">
                <span class="label lang-en">Hello</span>
                <span class="label lang-zh">你好</span>
                <p class="intro-text lang-en">
                    A collection of work, thoughts, and traces left along the way. Easis. 
                </p>
                <p class="intro-text lang-zh">
                    一段旅途中的收藏，记录思考、作品与痕迹。我是 Easis。
                </p>
            </section>

            <section class="about-section">
                <span class="label lang-en">Guestbook</span>
                <span class="label lang-zh">访客便签墙</span>
                <div class="pinboard" id="pinboard">
                    <div class="note-input">
                        <input type="text" id="guest-name" placeholder="Name (optional)">
                        <textarea id="guest-msg" placeholder="Leave a trace..."></textarea>
                        <button onclick="postNote()">Pin it</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        function switchLang(lang) {
            document.body.className = 'mode-' + lang;
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
        }

        function postNote() {
            const name = document.getElementById('guest-name').value || "Anonymous";
            const msg = document.getElementById('guest-msg').value;
            if (!msg) return;
            
            const note = document.createElement('div');
            note.className = 'note-card';
            note.style.transform = `rotate(${Math.random() * 2 - 1}deg)`;
            note.innerHTML = `<p>"${msg}"</p><div style="font-size: 0.8rem; opacity: 0.6">— ${name}</div>`;
            
            document.getElementById('pinboard').appendChild(note);
            document.getElementById('guest-msg').value = '';
            document.getElementById('guest-name').value = '';
        }
    </script>
</body>
</html>
