<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics | EASIS</title>
    <style>
        :root {
            --white: #F9F9F9;         /* 统一主页的美术馆白 */
            --fluo-yellow: #00E1D9;   /* 统一你的灵魂色：数码极光青 (如需原版亮黄，可改回 #E5EB15) */
            --black: #111111;         /* 统一极致石墨黑 */
        }
        
        body {
            background-color: var(--white); 
            color: var(--black); 
            margin: 0;
            font-family: "Space Grotesque", -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 导航栏同步 --- */
        .global-nav {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 40px 80px; 
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 1001;
            box-sizing: border-box; 
            border-bottom: 2px solid var(--black);
            background-color: var(--white);
        }
        .nav-logo a { 
            font-size: 2.2rem; 
            font-weight: 900; 
            text-decoration: none; 
            color: var(--black); 
            letter-spacing: -0.03em;
            display: inline-block;
            padding: 4px 18px;
            border: 2px solid transparent;
            transition: all 0.15s ease-in-out;
        }
        /* Logo 悬停交互同步主页 */
        .nav-logo a:hover {
            background-color: var(--fluo-yellow);
            border-color: var(--black);
            box-shadow: 4px 4px 0 var(--black);
        }

        .nav-links { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { 
            text-decoration: none; 
            color: var(--black); 
            font-size: 1.1rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            padding: 6px 16px; 
            border: 2px solid var(--black); 
            transition: 0.2s ease-in-out; 
        }
        .nav-links a:hover { 
            background: var(--fluo-yellow); 
            box-shadow: 4px 4px 0 var(--black);
        }

        /* --- 主内容布局 --- */
        .projects-container { 
            padding: 220px 80px 100px; 
            max-width: 1200px; 
            margin: 0 auto; 
            box-sizing: border-box;
        }
        .page-header { 
            margin-bottom: 80px; 
            border-left: 8px solid var(--black); 
            padding-left: 30px; 
        }
        .page-header h1 { 
            font-size: 4.5rem; 
            font-weight: 900; 
            margin: 0; 
            letter-spacing: -0.04em;
        }
        .page-header p {
            font-size: 1.2rem;
            margin-top: 10px;
            opacity: 0.6;
            font-weight: 500;
        }

        /* --- 项目卡片排列 --- */
        .project-card {
            display: grid; 
            grid-template-columns: 420px 1fr; 
            gap: 60px; 
            margin-bottom: 120px;
            text-decoration: none; 
            color: inherit; 
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .project-card:hover { 
            transform: translateX(12px); /* 保持高级的向右微移 */
        }
        
        .project-image { 
            width: 100%; 
            height: 260px; 
            background: var(--black); 
            overflow: hidden; 
            border: 2px solid var(--black); 
            box-shadow: 0px 0px 0 var(--fluo-yellow);
            transition: all 0.3s ease; 
        }
        /* 悬停时：图片边框弹出阴影，极具厚重感 */
        .project-card:hover .project-image { 
            box-shadow: 6px 6px 0 var(--black);
            border-color: var(--black);
        }
        .project-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: grayscale(100%); 
            transition: all 0.6s ease; 
            opacity: 0.8; 
        }
        .project-card:hover .project-image img { 
            filter: grayscale(0%); 
            opacity: 1; 
        }

        /* 卡片右侧信息区 */
        .project-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .project-category { 
            font-size: 0.8rem; 
            font-weight: 900; 
            background: var(--black); 
            color: var(--white) !important; 
            padding: 4px 10px; 
            width: fit-content; 
            margin-bottom: 20px; 
            letter-spacing: 0.1em;
        }
        .project-info h2 { 
            font-size: 2.2rem; 
            margin: 0 0 15px 0; 
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .project-info p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 30px 0;
            opacity: 0.7;
            font-weight: 500;
        }

        /* 💡 彻底修复闪烁：改用干净的独立块级标签交互，继承野兽派按钮风格 */
        .read-more { 
            font-size: 0.95rem;
            font-weight: 900; 
            color: var(--black);
            text-transform: uppercase;
            border: 2px solid var(--black); 
            padding: 6px 16px;
            width: fit-content;
            transition: all 0.2s ease-in-out; 
            box-shadow: 2px 2px 0 var(--black);
        }
        /* 悬停时反白高亮，极其稳定绝对不闪烁 */
        .project-card:hover .read-more {
            background-color: var(--fluo-yellow);
            box-shadow: 4px 4px 0 var(--black);
            transform: translate(-1px, -1px);
        }

        /* ==========================================================================
           📱 移动端自适应调校
           ========================================================================== */
        @media (max-width: 768px) {
            .global-nav { padding: 20px 30px; }
            .nav-logo a { font-size: 1.6rem; padding: 2px 10px; }
            .nav-links a { font-size: 0.9rem; padding: 4px 10px; }
            
            .projects-container { padding: 140px 24px 60px; }
            .page-header { margin-bottom: 50px; padding-left: 15px; }
            .page-header h1 { font-size: 2.8rem; }
            
            /* 手机端打破两栏，图片和文字顺畅地上下垂直排列 */
            .project-card { grid-template-columns: 1fr; gap: 25px; margin-bottom: 70px; }
            .project-card:hover { transform: none; } /* 手机端关闭横向位移 */
            .project-image { height: 200px; }
            .project-info h2 { font-size: 1.6rem; }
            .project-info p { margin-bottom: 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-logo"><a href="index.html">EASIS</a></div>
        <ul class="nav-links">
            <li><a href="economics.html" style="background:var(--fluo-yellow); box-shadow: 2px 2px 0 var(--black);">Economics</a></li>
            <li><a href="index.html">Back Home</a></li>
        </ul>
    </nav>

    <main class="projects-container">
        <header class="page-header">
            <h1>ECONOMICS</h1>
            <p>Structural analysis of market mechanisms and systems.</p>
        </header>

        <a href="#" class="project-card">
            <div class="project-image"><img src="images/eco-01.jpg" alt=""></div>
            <div class="project-info">
                <span class="project-category">System Analysis / 2025</span>
                <h2>某项经济系统研究标题</h2>
                <p>这里是研究摘要，文字在纯白底色下完美呈现。剔除了原本复杂的色彩呼吸，现在专注于研究成果本身的干净表达。</p>
                <span class="read-more">View Research</span>
            </div>
        </a>

        </main>

    </body>
</html>
