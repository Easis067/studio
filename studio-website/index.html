<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | ARCHIVE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --white: #F9F9F9;
            --periwinkle: #111111;
            --fluo-yellow: #00E1D9;
            --black: #111111;
        }

        body {
            background-color: var(--white);
            color: var(--black);
            margin: 0;
            font-family: "Space Grotesque", sans-serif;
            transition: background-color 4s cubic-bezier(0.4, 0, 0.2, 1), color 4s ease;
            overflow: hidden;
        }

        /* 核心反转逻辑 */
        body.is-active { background-color: var(--periwinkle); color: #F9F9F9; }
        body.is-active .global-nav, body.is-active .nav-groups, body.is-active .about-big-box { border-color: #F9F9F9 !important; }
        
        .global-nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 25px 80px; position: fixed; width: 100%; top: 0; 
            border-bottom: 1.5px solid var(--black); box-sizing: border-box;
        }

        .hero-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 100px 50px 100px;
            box-sizing: border-box;
        }

        /* ⚡ EASIS 13.5vw 设置 */
        .main-logo {
            font-size: 13.5vw;
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.06em;
            line-height: 0.8;
            color: var(--black);
        }

        .footer-nav { margin-top: auto; }

        /* ⚡ 布局：横线与下方的间距控制在 20px */
        .nav-groups {
            display: grid; 
            grid-template-columns: 0.8fr 1.2fr 1.2fr; 
            gap: 60px; 
            border-top: 1.5px solid var(--black); /* 顶部的横线 */
            padding-top: 20px; /* 挨着但保持一定距离 */
            list-style: none; 
            margin: 0;
        }

        /* ⚡ ABOUT 框：独立且占位不到三分之一 */
        .about-big-box {
            width: 100%;
            border: 1.5px solid var(--black);
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            box-shadow: 4px 4px 0 var(--black);
            transition: 0.2s;
        }

        .about-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; }
        .about-motto { font-size: 1rem; font-weight: 600; margin-top: 10px; opacity: 0.8; }
        .group-label { font-size: 1.1rem; font-weight: 700; display: inline-block; }
        .sub-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .sub-menu a { text-decoration: none; color: inherit; font-size: 1.1rem; opacity: 0.7; }
    </style>
</head>
<body id="dynamic-body">

    <nav class="global-nav">
        <div class="nav-logo" style="font-size: 2rem; font-weight: 900;">EASIS</div>
    </nav>

    <main class="hero-wrapper">
        <h1 class="main-logo">EASIS</h1>

        <nav class="footer-nav">
            <ul class="nav-groups">
                <!-- ⚡ ABOUT 阵营 -->
                <li>
                    <a href="about.html" class="about-big-box">
                        <div style="display: flex; justify-content: space-between;">
                            <span class="about-title">About Me</span>
                            <span>→</span>
                        </div>
                        <p class="about-motto">"Stay rational in research, stay perceptive in life."</p>
                    </a>
                </li>
                <!-- ⚡ WORK 阵营 -->
                <li>
                    <span class="group-label">Work & Research</span>
                    <div class="sub-menu">
                        <a href="#">Economics</a>
                        <a href="#">Innovation</a>
                    </div>
                </li>
                <!-- ⚡ LOGS 阵营 -->
                <li>
                    <span class="group-label">Personal Logs</span>
                    <div class="sub-menu">
                        <a href="#">World View</a>
                        <a href="#">Observations</a>
                    </div>
                </li>
            </ul>
        </nav>
    </main>

    <script>
        const body = document.getElementById('dynamic-body');
        function runAnimation() {
            setTimeout(() => { body.classList.add('is-active'); }, 15000); 
            setTimeout(() => { body.classList.remove('is-active'); }, 30000); 
            setTimeout(runAnimation, 35000); 
        }
        runAnimation();
    </script>
</body>
</html>
