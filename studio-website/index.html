<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | ARCHIVE</title>
    
    <style>
        :root {
            --white: #F9F9F9;         
            --fluo-yellow: #00E1D9;   
            --black: #111111;         
        }

        body {
            background-color: var(--white);
            color: var(--black);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .lang-zh.hidden, .lang-en.hidden { display: none !important; }

        /* --- 顶部导航 --- */
        .global-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 80px; 
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1001;
            box-sizing: border-box;
            border-bottom: 1.5px solid var(--black);
            background-color: var(--white); 
        }

        .nav-logo a {
            font-size: 2rem;
            font-weight: 900;
            text-decoration: none;
            color: var(--black);
            letter-spacing: -0.03em;
        }

        .nav-menu-container {
            display: flex;
            align-items: center;
        }

        .nav-links { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; align-items: center; }
        .nav-links > li { position: relative; }
        .nav-links > li > a { 
            text-decoration: none; color: var(--black); font-size: 1.05rem; font-weight: 700; 
            text-transform: uppercase; padding: 6px 16px; border: 1.5px solid var(--black);
            display: inline-block; transition: 0.2s ease;
        }
        
        .nav-links > li > a:hover { 
            background: var(--fluo-yellow) !important; 
            box-shadow: 4px 4px 0 var(--black);
        }

        .menu-divider {
            width: 0;
            height: 22px;
            border-left: 1.5px solid var(--black);
            margin: 0 20px;
            opacity: 0.8;
        }

        /* --- 主内容 --- */
        .hero-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            padding: 18vh 80px 25vh 80px; 
            box-sizing: border-box;
            position: relative;
        }

        .main-logo {
            font-size: 15vw;
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.06em;
            line-height: 0.8;
            color: var(--black); 
            user-select: none;
            pointer-events: none; /* 彻底防止大字挡住下方的点击 */
        }

        .center-statement {
            margin-top: 25px;
            padding: 10px 24px;
            background-color: var(--black);
            display: inline-block;
            width: fit-content;
        }
        .center-statement span {
            font-weight: 700; letter-spacing: 0.4em; font-size: 1rem;
            color: var(--white);
        }

        /* --- 底部区域：绝对浮动在最上层 --- */
        .footer-nav {
            margin-top: auto;
            padding-top: 40px;
            width: 100%;
            z-index: 999; 
            position: relative;
        }
        
        .nav-groups {
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 40px; 
            border-top: 1.5px solid var(--black); 
            padding-top: 35px; 
            list-style: none; 
            margin: 0;
        }

        .group-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* ABOUT 大框 */
        .about-big-box {
            width: 100%;
            box-sizing: border-box;
            border: 1.5px solid var(--black);
            padding: 18px 20px;
            background: var(--white);
            text-decoration: none;
            color: inherit;
            box-shadow: 4px 4px 0 var(--black);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px; 
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .about-big-box:hover {
            background: var(--fluo-yellow) !important;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
        }

        .about-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .about-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; }
        .about-arrow { font-size: 1.4rem; font-weight: 900; }
        .about-motto { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin: 15px 0 0 0; opacity: 0.8; }

        /* 分类标签 */
        .group-label {
            font-size: 1.1rem; 
            font-weight: 700; background: var(--white); 
            color: var(--black); padding: 6px 16px; display: inline-block;
            margin-bottom: 20px; border: 1.5px solid var(--black);
            box-shadow: 2px 2px 0 var(--black);
        }

        .sub-menu { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        .sub-group-title {
            font-size: 0.8rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.05em; opacity: 0.4; margin-top: 5px; margin-bottom: 2px;
        }

        /* 核心点击链接 */
        .sub-menu a {
            display: block; 
            text-decoration: none; 
            color: var(--black); 
            font-size: 1.2rem; 
            font-weight: 700; 
            width: fit-content; 
            padding: 2px 0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .sub-menu a:hover { 
            color: var(--black);
            border-bottom-color: var(--fluo-yellow);
            transform: translateX(4px);
        }

        /* 语言切换 */
        .lang-switch { margin-left: 40px; border: 1.5px solid var(--black); padding: 2px; display: flex; background: transparent; }
        .lang-switch span { padding: 4px 12px; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--black); }
        .lang-switch .active { background: var(--fluo-yellow); }

        @media (max-width: 768px) {
            .global-nav { padding: 15px 20px; }
            .nav-menu-container { display: none; }
            .hero-wrapper { padding: 120px 20px 40px 20px; }
            .main-logo { font-size: 24vw; }
            .footer-nav { position: static; margin-top: 40px; }
            .nav-groups { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-logo"><a href="index.html">EASIS</a></div>
        <div style="display: flex; align-items: center;">
            <div class="nav-menu-container">
                <ul class="nav-links">
                    <li><a href="about.html"><span class="lang-en">Me</span><span class="lang-zh hidden">个人</span></a></li>
                    <li><a href="economics.html"><span class="lang-en">Work</span><span class="lang-zh hidden">经历</span></a></li>
                </ul>
            </div>
            <div class="lang-switch">
                <span id="btn-en" onclick="setLanguage('en')" class="active">EN</span>
                <span id="btn-zh" onclick="setLanguage('zh')">中文</span>
            </div>
        </div>
    </nav>

    <main class="hero-wrapper">
        <h1 class="main-logo">EASIS</h1>
        <div class="center-statement">
            <p style="margin: 0;">
                <span class="lang-en">SYSTEMS / MEDIUM / ARCHIVE</span>
                <span class="lang-zh hidden">系统 / 媒介 / 档案</span>
            </p>
        </div>

        <nav class="footer-nav">
            <ul class="nav-groups">
                
                <li>
                    <a href="about.html" class="about-big-box">
                        <div class="about-header">
                            <span class="about-title">
                                <span class="lang-en">About Me</span><span class="lang-zh hidden">关于我</span>
                            </span>
                            <span class="about-arrow">→</span>
                        </div>
                        <p class="about-motto">
                            <span class="lang-en">"Stay rational in research, stay perceptive in life."</span>
                            <span class="lang-zh hidden">“于研究中保持理性，于生活里留存感知。”</span>
                        </p>
                    </a>
                </li>

                <li class="group-container">
                    <span class="group-label">
                        <span class="lang-en">Research</span><span class="lang-zh hidden">专业研究</span>
                    </span>
                    <div class="sub-menu">
                        <span class="sub-group-title"><span class="lang-en">Project</span><span class="lang-zh hidden">课题</span></span>
                        <a href="economics.html"><span class="lang-en">Economics</span><span class="lang-zh hidden">经济学研究</span></a>
                        <a href="#"><span class="lang-en">Innovation</span><span class="lang-zh hidden">创新学研究</span></a>
                    </div>
                </li>

                <li class="group-container">
                    <span class="group-label">
                        <span class="lang-en">Personal Logs</span><span class="lang-zh hidden">日常留存</span>
                    </span>
                    <div class="sub-menu">
                        <span class="sub-group-title"><span class="lang-en">Observer</span><span class="lang-zh hidden">记录</span></span>
                        <a href="#"><span class="lang-en">Visual Archive</span><span class="lang-zh hidden">影像档案</span></a>
                    </div>
                </li>

            </ul>
        </nav>
    </main>

    <script>
        function setLanguage(lang) {
            document.querySelectorAll('.lang-en').forEach(el => lang === 'zh' ? el.classList.add('hidden') : el.classList.remove('hidden'));
            document.querySelectorAll('.lang-zh').forEach(el => lang === 'zh' ? el.classList.remove('hidden') : el.classList.add('hidden'));
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
        }
    </script>
</body>
</html>
