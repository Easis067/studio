    <style>
        /* 语言切换专用样式 */
        .lang-zh.hidden, .lang-en.hidden {
            display: none !important;
        }
        
        /* 专门针对中文字体进行放大和加重 */
        .lang-zh {
            font-size: 1.1em; /* 比默认字体大 10% */
            font-weight: 400; /* 略微加粗，增加辨识度 */
            letter-spacing: 0.05em;
        }

        .lang-switch .active {
            font-weight: bold;
            color: #4a4a4a;
        }
        .lang-switch span {
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>
<body class="home-page">

            <div class="lang-switch" style="margin-left: 30px; font-size: 0.75rem; color: #bcaaa4; letter-spacing: 0.1em;">
                <span id="btn-en" onclick="setLanguage('en')" class="active">EN</span>
                <span style="margin: 0 5px; opacity: 0.3;">/</span>
                <span id="btn-zh" onclick="setLanguage('zh')">中文</span>
            </div>
        </div>
    </nav>

        </div>

        <nav class="footer-nav">
            <ul class="nav-groups">
                <li>

                        <span class="lang-en">Personal</span><span class="lang-zh hidden">个人</span>

    </main>

    <script>
        function setLanguage(lang) {
            const enElements = document.querySelectorAll('.lang-en');
            const zhElements = document.querySelectorAll('.lang-zh');
            const btnEn = document.getElementById('btn-en');
            const btnZh = document.getElementById('btn-zh');

            if (lang === 'zh') {
                enElements.forEach(el => el.classList.add('hidden'));
                zhElements.forEach(el => el.classList.remove('hidden'));
                btnZh.classList.add('active');
                btnEn.classList.remove('active');
            } else {
                zhElements.forEach(el => el.classList.add('hidden'));
                enElements.forEach(el => el.classList.remove('hidden'));
                btnEn.classList.add('active');
                btnZh.classList.remove('active');
            }
            localStorage.setItem('site-lang', lang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('site-lang') || 'en';
            setLanguage(savedLang);
        });
    </script>
