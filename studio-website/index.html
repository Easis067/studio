<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --white: #F9F9F9; --black: #111111; }
        
        body { 
            background-color: var(--white); 
            color: var(--black); 
            margin: 0; 
            font-family: "Space Grotesque", sans-serif; 
            overflow: hidden; 
        }

        /* 顶部栏：严格对齐，仅保留左侧标识 */
        .global-nav { 
            padding: 25px 80px; 
            border-bottom: 1.5px solid var(--black); 
        }
        .logo-text { font-size: 2rem; font-weight: 900; }

        /* 主视觉区：确保 EASIS 靠上，留出底部空间 */
        .hero-wrapper { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding: 80px 100px 50px 100px; 
            box-sizing: border-box; 
        }

        .main-logo { 
            font-size: 13.5vw; 
            font-weight: 900; 
            margin: 0; 
            letter-spacing: -0.06em; 
            line-height: 0.8; 
        }

        /* 底部导航区域 */
        .footer-nav { margin-top: auto; }

        /* 底部三列布局：横线与板块衔接 */
        .nav-groups {
            display: grid; 
            grid-template-columns: 0.8fr 1.2fr 1.2fr; 
            gap: 60px; 
            border-top: 1.5px solid var(--black); 
            padding-top: 20px;
            list-style: none; 
            margin: 0;
        }

        /* ABOUT ME 框：独立且精准占位 */
        .about-big-box {
            width: 100%; 
            border: 1.5px solid var(--black); 
            padding: 20px;
            text-decoration: none; 
            color: inherit; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between; 
            min-height: 120px;
            box-shadow: 4px 4px 0 var(--black); 
            transition: 0.2s;
        }
        
        .about-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; }
        .about-motto { font-size: 1rem; font-weight: 600; margin-top: 10px; opacity: 0.8; }
        
        /* 列表项样式 */
        .group-label { font-size: 1.1rem; font-weight: 700; display: block; margin-bottom: 15px; }
        .sub-menu { display: flex; flex-direction: column; gap: 10px; }
        .sub-menu a { text-decoration: none; color: var(--black); font-size: 1.1rem; opacity: 0.7; }
        .sub-menu a:hover { opacity: 1; }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="logo-text">EASIS</div>
    </nav>

    <main class="hero-wrapper">
        <h1 class="main-logo">EASIS</h1>

        <nav class="footer-nav">
            <ul class="nav-groups">
                <!-- 关于我：唯一入口 -->
                <li>
                    <a href="about.html" class="about-big-box">
                        <div style="display: flex; justify-content: space-between;">
                            <span class="about-title">ABOUT ME</span>
                            <span>→</span>
                        </div>
                        <p class="about-motto">"Stay rational in research, stay perceptive in life."</p>
                    </a>
                </li>
                <!-- 专业研究 -->
                <li>
                    <span class="group-label">Work & Research</span>
                    <div class="sub-menu">
                        <a href="#">Economics</a>
                        <a href="#">Innovation</a>
                    </div>
                </li>
                <!-- 日常留存 -->
                <li>
                    <span class="group-label">Personal Logs</span>
                    <div class="sub-menu">
                        <a href="#">World View</a>
                        <a href="#">Observations</a>
                    </div>
                </li>
            </ul>
        </nav>
    </main>

</body>
</html>
