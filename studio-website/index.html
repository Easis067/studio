<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | ARCHIVE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --white: #F9F9F9;          
            --periwinkle: #111111;    
            --fluo-yellow: #00E1D9;   
            --black: #111111;          
        }

        body {
            background-color: var(--white);
            color: var(--black);
            margin: 0;
            font-family: "Space Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 4s cubic-bezier(0.4, 0, 0.2, 1), color 4s ease, border-color 4s ease; 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden; 
        }

        body.is-active { background-color: var(--periwinkle); color: #F9F9F9; }
        
        body.is-active .global-nav,
        body.is-active .nav-links > li > a,
        body.is-active .nav-groups,
        body.is-active .lang-switch { border-color: #F9F9F9 !important; }
        
        body.is-active .nav-logo a,
        body.is-active .nav-links > li > a,
        body.is-active .sub-menu a,
        body.is-active .lang-switch span,
        body.is-active .main-logo { color: #F9F9F9 !important; }
        
        body.is-active .group-label, 
        body.is-active .about-box-link { background: transparent !important; color: #F9F9F9 !important; border-color: #F9F9F9 !important; }
        
        body.is-active .about-box-link:hover { background: var(--fluo-yellow) !important; color: #111111 !important; }

        .lang-zh.hidden, .lang-en.hidden { display: none !important; }

        .global-nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 100px; position: fixed; width: 100%; top: 0; z-index: 1001; box-sizing: border-box; border-bottom: 1.5px solid var(--black); background-color: inherit; }
        .nav-logo a { font-size: 2rem; font-weight: 900; text-decoration: none; color: var(--black); letter-spacing: -0.03em; }
        .nav-links { display: flex; list-style: none; gap: 30px; margin: 0; padding: 0; }
        .nav-links > li > a { text-decoration: none; color: var(--black); font-size: 1.05rem; font-weight: 700; text-transform: uppercase; padding: 6px 16px; border: 1.5px solid var(--black); display: inline-block; transition: 0.2s ease-in-out; }
        .nav-links > li > a:hover { background: var(--fluo-yellow) !important; color: #111111 !important; border-color: var(--black); box-shadow: 4px 4px 0 var(--black); }

        .dropdown-menu { position: absolute; top: 100%; left: 0; background: var(--black); min-width: 200px; list-style: none; padding: 10px 0; margin: 0; opacity: 0; visibility: hidden; border: 1.5px solid var(--black); transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-links > li:hover .dropdown-menu { opacity: 1; visibility: visible; margin-top: 10px; }
        .dropdown-menu li a { color: var(--white) !important; padding: 12px 20px; display: block; text-decoration: none; font-weight: 600; font-size: 0.95rem; }

        .hero-wrapper { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 140px 100px 60px 100px; box-sizing: border-box; }
        .main-logo { font-size: 15vw; font-weight: 900; margin: 0; letter-spacing: -0.06em; line-height: 0.8; color: var(--black); }
        
        .footer-nav { width: 100%; }
        .nav-groups { display: grid; grid-template-columns: 1.2fr 1fr 1fr; border-top: 1.5px solid var(--black); padding-top: 40px; list-style: none; margin: 0; padding-left: 0; gap: 50px; }
        .group-label { font-size: 1.15rem; font-weight: 900; padding: 10px 24px; border: 1.5px solid var(--black); box-shadow: 4px 4px 0 var(--black); display: inline-block; margin-bottom: 25px; text-transform: uppercase; }
        .about-box-link { display: flex; flex-direction: column; text-decoration: none; color: inherit; border: 1.5px solid var(--black); padding: 16px 24px; min-height: 140px; box-shadow: 4px 4px 0 var(--black); }
        .sub-menu a { display: block; text-decoration: none; color: inherit; margin-bottom: 18px; font-weight: 600; }
        
        .lang-switch { margin-left: 50px; border: 1.5px solid var(--black); padding: 2px; display: flex; }
        .lang-switch span { padding: 4px 12px; cursor: pointer; font-weight: 700; }
        .lang-switch .active { background: var(--fluo-yellow); }
    </style>
</head>
<body id="dynamic-body">

    <nav class="global-nav">
        <div class="nav-logo"><a href="index.html">EASIS</a></div>
        <div style="display: flex; align-items: center;">
            <ul class="nav-links">
                <li class="dropdown">
                    <a href="javascript:void(0)">Work</a>
                    <ul class="dropdown-menu">
                        <li><a href="project/projects.html">Projects</a></li>
                        <li><a href="experience.html">Experience</a></li>
                    </ul>
                </li>
                <li class="dropdown">
                    <a href="javascript:void(0)">Logs</a>
                    <ul class="dropdown-menu">
                        <li><a href="archive.html">Visual Archive</a></li>
                        <li><a href="logs.html">Text Logs</a></li>
                    </ul>
                </li>
                <li><a href="about.html">About Me</a></li>
            </ul>
        </div>
    </nav>

    <main class="hero-wrapper">
        <h1 class="main-logo">EASIS</h1>
        <nav class="footer-nav">
            <ul class="nav-groups">
                <li>
                    <a href="about.html" class="about-box-link">About Me →</a>
                </li>
                <li>
                    <span class="group-label">Work</span>
                    <div class="sub-menu">
                        <a href="project/projects.html">Projects</a>
                        <a href="experience.html">Experience</a>
                    </div>
                </li>
                <li>
                    <span class="group-label">Logs</span>
                    <div class="sub-menu">
                        <a href="archive.html">Visual Archive</a>
                        <a href="logs.html">Text Logs</a>
                    </div>
                </li>
            </ul>
        </nav>
    </main>

    <script>
        const body = document.getElementById('dynamic-body');
        function runAnimation() {
            setTimeout(() => { body.classList.add('is-active'); }, 15000); 
            setTimeout(() => { body.classList.remove('is-active'); }, 30000); 
            setTimeout(runAnimation, 35000); 
        }
        runAnimation();
    </script>
</body>
</html>
