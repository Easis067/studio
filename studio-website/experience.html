<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | EXPERIENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 这里复用了你首页的 CSS 变量和基础样式 */
        :root { --white: #F9F9F9; --black: #111111; --fluo-yellow: #00E1D9; }
        body { background-color: var(--white); color: var(--black); margin: 0; font-family: "Space Grotesque", sans-serif; }
        
        /* 经历页面的内容容器 */
        .content-container { max-width: 800px; margin: 150px auto; padding: 40px; }
        .page-title { font-size: 4rem; font-weight: 900; margin-bottom: 50px; text-transform: uppercase; }
        
        .exp-item { border-left: 3px solid var(--black); padding-left: 30px; margin-bottom: 60px; }
        .exp-item h2 { margin: 0 0 10px 0; font-size: 1.8rem; }
        .exp-meta { font-weight: 700; opacity: 0.6; margin-bottom: 15px; }
        
        /* 为了保持一致性，复用导航样式 */
        .global-nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 100px; border-bottom: 1.5px solid var(--black); }
        .nav-logo a { font-size: 2rem; font-weight: 900; text-decoration: none; color: var(--black); }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-logo"><a href="index.html">EASIS</a></div>
        <a href="index.html" style="text-decoration:none; color:#111; font-weight:900; border: 1.5px solid #111; padding: 5px 15px;">BACK</a>
    </nav>

    <main class="content-container">
        <h1 class="page-title">Experience</h1>
        
        <section class="exp-item">
            <h2>Lead Designer</h2>
            <div class="exp-meta">Company Name | 2024 - Present</div>
            <p>这里描述你的职责和成就。</p>
        </section>

        <section class="exp-item">
            <h2>Researcher</h2>
            <div class="exp-meta">University | 2021 - 2023</div>
            <p>这里描述你的科研经历。</p>
        </section>
    </main>

</body>
</html>
