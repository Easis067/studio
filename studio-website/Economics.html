<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics | EASIS</title>
    <style>
        :root {
            --periwinkle: #53589A; --fluo-yellow: #E5EB15; --white: #FFFFFF; --black: #000000;
        }
        body {
            background-color: var(--white); color: var(--black); margin: 0;
            font-family: "Space Grotesque", sans-serif;
            transition: background-color 8s ease-in-out, color 8s ease-in-out;
        }
        body.is-purple { background-color: var(--periwinkle); color: var(--white); }

        /* 导航栏同步 */
        .global-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 40px 80px; position: fixed; width: 100%; top: 0; z-index: 1001;
            box-sizing: border-box; border-bottom: 2px solid currentColor; transition: 8s;
        }
        .nav-logo a { font-size: 2.2rem; font-weight: 900; text-decoration: none; color: inherit; }
        .nav-links { display: flex; list-style: none; gap: 40px; }
        .nav-links a { text-decoration: none; color: inherit; font-size: 1.25rem; font-weight: 800; text-transform: uppercase; padding: 8px 18px; border: 2px solid currentColor; transition: 0.3s; }
        .nav-links a:hover { background: var(--fluo-yellow); color: var(--black) !important; }

        .projects-container { padding: 180px 10vw 100px; max-width: 1200px; margin: 0 auto; }
        .page-header { margin-bottom: 80px; border-left: 10px solid var(--fluo-yellow); padding-left: 30px; }
        .page-header h1 { font-size: 3.5rem; font-weight: 900; margin: 0; }

        /* 项目卡片排列 */
        .project-card {
            display: grid; grid-template-columns: 400px 1fr; gap: 50px; margin-bottom: 100px;
            text-decoration: none; color: inherit; transition: 0.4s;
        }
        .project-card:hover { transform: translateX(10px); }
        .project-image { width: 100%; height: 250px; background: var(--black); overflow: hidden; border: 0px solid var(--fluo-yellow); transition: 0.3s; }
        .project-card:hover .project-image { border: 6px solid var(--fluo-yellow); }
        .project-image img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.8s; opacity: 0.8; }
        .project-card:hover .project-image img { filter: grayscale(0%); opacity: 1; }

        .project-category { font-size: 0.8rem; font-weight: 900; background: var(--fluo-yellow); color: var(--black) !important; padding: 4px 10px; width: fit-content; margin-bottom: 15px; }
        .project-info h2 { font-size: 2rem; margin: 0 0 20px 0; }
        .read-more { font-weight: 900; border-bottom: 3px solid var(--fluo-yellow); align-self: flex-start; transition: 0.3s; }
    </style>
</head>
<body id="dynamic-body">
    <nav class="global-nav">
        <div class="nav-logo"><a href="index.html">EASIS</a></div>
        <ul class="nav-links">
            <li><a href="economics.html" style="background:var(--fluo-yellow); color:var(--black)!important;">Economics</a></li>
            <li><a href="index.html">Back Home</a></li>
        </ul>
    </nav>

    <main class="projects-container">
        <header class="page-header">
            <h1>ECONOMICS</h1>
            <p>Structural analysis of market mechanisms and systems.</p>
        </header>

        <a href="#" class="project-card">
            <div class="project-image"><img src="images/eco-01.jpg" alt=""></div>
            <div class="project-info">
                <span class="project-category">System Analysis / 2025</span>
                <h2>某项经济系统研究标题</h2>
                <p>这里是研究摘要，文字会随背景 8s 自动变白，确保紫底时清晰可见。</p>
                <span class="read-more">View Research</span>
            </div>
        </a>
    </main>

    <script>
        let isPeriwinkle = false;
        const body = document.getElementById('dynamic-body');
        function breatheColor() {
            body.classList.toggle('is-purple');
            isPeriwinkle = !isPeriwinkle;
        }
        setInterval(breatheColor, 8000);
    </script>
</body>
</html>
