<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | LOGS</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --white: #F9F9F9; 
            --black: #111111; 
            --fluo-yellow: #00E1D9; /* 你的主配色 */
            --accent-purple: #7B61FF; /* 新增：体系内和谐色 */
        }
        body { background-color: var(--white); color: var(--black); margin: 0; font-family: "Space Grotesque", sans-serif; padding-top: 150px; }

        .global-nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 100px; position: fixed; width: 100%; top: 0; z-index: 1001; border-bottom: 1.5px solid var(--black); background: var(--white); box-sizing: border-box; }
        .nav-logo a { font-size: 2rem; font-weight: 900; text-decoration: none; color: var(--black); }
        .nav-links { display: flex; list-style: none; gap: 30px; align-items: center; }
        .nav-links > li > a { text-decoration: none; color: var(--black); font-weight: 700; text-transform: uppercase; padding: 6px 16px; border: 1.5px solid var(--black); transition: 0.2s; }
        
        /* 导航激活：使用新的 accent-purple */
        .nav-links > li > a.active-link { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }
        .nav-links > li > a:hover { background: var(--accent-purple); color: white; box-shadow: 4px 4px 0 var(--black); border-color: var(--accent-purple); }

        .lang-switch { border: 1.5px solid var(--black); display: flex; padding: 2px; }
        .lang-switch span { padding: 4px 12px; cursor: pointer; font-weight: 700; font-size: 0.9rem; }
        .lang-switch .active { background: var(--accent-purple); color: white; }
        .lang-zh.hidden, .lang-en.hidden { display: none !important; }

        .main-container { padding: 0 100px 100px 100px; }
        
        /* 四大分区：极光体系的扩展 */
        .logs-menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .menu-card { 
            border: 1.5px solid var(--black); 
            padding: 40px; 
            text-decoration: none; 
            color: var(--black); 
            transition: 0.2s; 
            display: block; 
            box-shadow: 4px 4px 0 var(--black);
        }
        .menu-card:hover { 
            background: var(--accent-purple); 
            color: white;
            transform: translate(-2px, -2px); 
            box-shadow: 6px 6px 0 var(--black); 
            border-color: var(--accent-purple);
        }
        .menu-card h2 { margin: 0 0 10px 0; font-size: 2.5rem; text-transform: uppercase; }
        .menu-card p { margin: 0; font-weight: 600; opacity: 0.7; }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-logo"><a href="index.html">EASIS</a></div>
        <ul class="nav-links">
            <li><a href="project/projects.html">Work</a></li>
            <li><a href="logs.html" class="active-link">Logs</a></li>
            <li><a href="about.html">About Me</a></li>
            <li>
                <div class="lang-switch">
                    <span id="btn-en" onclick="setLanguage('en')" class="active">EN</span>
                    <span id="btn-zh" onclick="setLanguage('zh')">中文</span>
                </div>
            </li>
        </ul>
    </nav>

    <main class="main-container">
        <h1 style="font-size: 3rem; margin-bottom: 50px; letter-spacing: -0.05em;">LOGS</h1>
        
        <div class="logs-menu-grid">
            <a href="#" class="menu-card">
                <h2>Words</h2>
                <p><span class="lang-en">Reflections & Thoughts</span><span class="lang-zh hidden">深度思辨与文字随笔</span></p>
            </a>
            <a href="#" class="menu-card">
                <h2>Culture</h2>
                <p><span class="lang-en">Arts & Exhibitions</span><span class="lang-zh hidden">文化、艺术与展览笔记</span></p>
            </a>
            <a href="#" class="menu-card">
                <h2>Snap</h2>
                <p><span class="lang-en">Visual Moments</span><span class="lang-zh hidden">瞬间影像记录</span></p>
            </a>
            <a href="#" class="menu-card">
                <h2>Daily Bites</h2>
                <p><span class="lang-en">Food & Daily Life</span><span class="lang-zh hidden">饮食与生活碎片</span></p>
            </a>
        </div>
    </main>

    <script>
        function setLanguage(lang) {
            document.querySelectorAll('.lang-en').forEach(el => lang === 'zh' ? el.classList.add('hidden') : el.classList.remove('hidden'));
            document.querySelectorAll('.lang-zh').forEach(el => lang === 'zh' ? el.classList.remove('hidden') : el.classList.add('hidden'));
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
        }
    </script>
</body>
</html>
