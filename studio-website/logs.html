<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASIS | LOGS</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --white: #F9F9F9; 
            --black: #111111; 
            --forest-green: #2D5A27; /* Logs 专属色 */
            --fluo-yellow: #00E1D9; 
        }
        body { background-color: var(--white); color: var(--black); margin: 0; font-family: "Space Grotesque", sans-serif; padding-top: 150px; }

        /* 导航栏 */
        .global-nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 100px; position: fixed; width: 100%; top: 0; z-index: 1001; border-bottom: 1.5px solid var(--black); background: var(--white); box-sizing: border-box; }
        .nav-logo a { font-size: 2rem; font-weight: 900; text-decoration: none; color: var(--black); }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links > li > a { text-decoration: none; color: var(--black); font-weight: 700; text-transform: uppercase; padding: 6px 16px; border: 1.5px solid var(--black); }

        /* 内容区 */
        .main-container { padding: 0 100px 100px 100px; }
        .page-title { font-size: 4rem; font-weight: 900; margin-bottom: 30px; text-transform: uppercase; }

        /* 筛选器 */
        .filter-bar { display: flex; gap: 15px; margin-bottom: 50px; }
        .filter-btn { padding: 8px 20px; border: 1.5px solid var(--black); background: transparent; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .filter-btn:hover, .filter-btn.active { background: var(--forest-green); color: var(--white); border-color: var(--forest-green); }

        /* 瀑布流布局 */
        .logs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .log-card { border: 1.5px solid var(--black); padding: 20px; transition: 0.3s; }
        .log-card:hover { transform: translateY(-5px); border-color: var(--forest-green); }
        .log-card h3 { margin: 10px 0; font-size: 1.2rem; }
        .category-tag { font-size: 0.7rem; font-weight: 900; color: var(--forest-green); text-transform: uppercase; letter-spacing: 0.1em; }

        /* 饮食日历小块特殊样式 */
        .bites-card { background: #f0f0f0; }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-logo"><a href="index.html">EASIS</a></div>
        <ul class="nav-links">
            <li><a href="project/projects.html">Work</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="logs.html" style="background: var(--forest-green); color: white;">Logs</a></li>
        </ul>
    </nav>

    <main class="main-container">
        <h1 class="page-title">Logs</h1>
        
        <div class="filter-bar">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Words</button>
            <button class="filter-btn">Culture</button>
            <button class="filter-btn">Snap</button>
            <button class="filter-btn">Daily Bites</button>
        </div>

        <div class="logs-grid">
            <!-- 示例：文字记录 -->
            <article class="log-card">
                <span class="category-tag">Words</span>
                <h3>关于经济与创新的深度反思</h3>
                <p>2026.06.01</p>
            </article>

            <!-- 示例：看展记录 -->
            <article class="log-card">
                <span class="category-tag">Culture</span>
                <h3>泰特美术馆观展报告</h3>
                <p>2026.05.20</p>
            </article>

            <!-- 示例：饮食记录 -->
            <article class="log-card bites-card">
                <span class="category-tag">Daily Bites</span>
                <h3>09 JUN | London</h3>
                <p>今天尝试了那家意面，艺术感十足。</p>
            </article>
        </div>
    </main>

</body>
</html>
